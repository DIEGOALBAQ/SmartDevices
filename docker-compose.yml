version: '3.8'

services:
  # 1. Base de Datos (Asumiendo que usas MySQL)
  db:
    image: mysql:8.0
    container_name: smartdevices-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: smartdevices_db
      MYSQL_USER: smart_user
      MYSQL_PASSWORD: user_password_seguro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # AQUÍ ESTÁ LA MAGIA: Montamos tu carpeta sql para que se ejecute al inicio
      - ./sql:/docker-entrypoint-initdb.d

  # 2. Tu aplicación Java
  app:
    build: . 
    container_name: smartdevices-app
    restart: always
    ports:
      - "8080:8080" # Cambia el primer 8080 si tu app usa otro puerto
    environment:
      # Conectamos Spring Boot a la base de datos
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/smartdevices_db?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: smart_user
      SPRING_DATASOURCE_PASSWORD: user_password_seguro
    depends_on:
      - db

volumes:
  db_data: